<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | BookFair Answers</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a class="brand" href="index.html"><span class="brand-mark">▣</span> BookFair<span>Answers</span></a><nav><a href="index.html">Home</a></nav></header><main class="access"><div class="access-card"><div class="eyebrow">SECURE STUDENT ACCESS</div><h2>Welcome back.</h2><p>Sign in to access the answer sheet linked to your book.</p><form id="login"><label>Student ID<input id="id" required placeholder="Enter Student ID"></label><label>Password<input id="pw" type="password" required placeholder="Enter password"></label><button class="primary">Sign in →</button><small id="msg"></small></form><p class="demo">Demo login: <button type="button" id="demo">Student / 1234</button></p></div></main><script>const f=document.getElementById('login'),m=document.getElementById('msg');document.getElementById('demo').onclick=()=>{id.value='Student';pw.value='1234'};f.onsubmit=e=>{e.preventDefault();if(id.value==='Student'&&pw.value==='1234'){sessionStorage.setItem('bookfairAuth','1');location.href='answers.html'}else{m.textContent='Invalid student ID or password.';m.style.color='#d14343'}};</script></body></html>
