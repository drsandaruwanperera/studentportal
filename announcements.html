ding:8px 11px;border-radius:8px;font-size:9px;font-weight:800;color:#667085}.theme button.active{background:#eeeaff;color:#5b4cf6}.dark-mode{background:#0b1220;color:#eef2ff}.dark-mode .side,.dark-mode .theme,.dark-mode .back{background:#111827;border-color:#29344b}.dark-mode .brand b,.dark-mode .top h1{color:#fff}.dark-mode .brand span,.dark-mode .side nav a,.dark-mode .top p{color:#aeb7c9}.dark-mode .side nav a.active{color:#fff}.dark-mode .theme button{color:#aeb7c9}.dark-mode .theme button.active{background:#29235d;color:#fff}@media(max-width:800px){.side{display:none}.main{margin-left:0;padding:20px 15px 85px}.top h1{font-size:23px}.back{display:none}.theme{left:15px;right:15px;justify-content:center}.theme button{flex:1}}.notice{background:#fff;border:1px solid #e7eaf0;border-radius:18px;padding:20px;display:flex;gap:15px;align-items:flex-start;margin-bottom:12px}.notice i{width:48px;height:48px;border-radius:14px;background:#fff1df;display:grid;place-items:center;font-style:normal;font-size:22px;flex:none}.notice h3{margin:0 0 5px;font-size:15px}.notice p{margin:0;color:#718096;font-size:10px;line-height:1.6}.tag{display:inline-block;margin-top:8px;padding:5px 8px;border-radius:20px;background:#eeeaff;color:#5b4cf6;font-size:8px;font-weight:800}.empty{padding:28px;text-align:center;border:1px dashed #dfe4ee;border-radius:18px;color:#7b8799;font-size:11px;background:#fff}.dark-mode .notice,.dark-mode .empty{background:#151d2f;border-color:#29344b}.dark-mode .notice h3{color:#fff}.dark-mode .notice p{color:#9aa6ba}@media(max-width:800px){.notice{align-items:flex-start}}.mobile-nav{display:none}@media(max-width:800px){.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(4,1fr);left:10px;right:10px;bottom:10px;z-index:1000;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border:1px solid #e7eaf0;border-radius:17px;padding:6px;box-shadow:0 15px 35px rgba(15,23,42,.12)}.mobile-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 3px;border-radius:11px;text-decoration:none;color:#78849a;font-size:8px;font-weight:800}.mobile-nav a.active{background:#eeeaff;color:#5b4cf6}.dark-mode .mobile-nav{background:rgba(17,24,39,.95);border-color:#29344b}.dark-mode .mobile-nav a{color:#aeb7c9}.dark-mode .mobile-nav a.active{background:#29235d;color:#fff}}</style><style id="final-dark-page">

<div class="side-bottom"><a class="logout" href="index.html">↪ Logout</a></div></aside><main class="main"><div class="top"><div><h1>Announcements</h1><p>Important information and updates for students.</p></div><a class="back" href="dashboard.html">← Dashboard</a></div><div id="announcementList" class="announcement-list">
<div id="firestoreAnnouncementList"></div>
</div></main><script>if(sessionStorage.getItem("loggedIn")!=="true")location.replace("index.html");document.body.classList.add("dark-mode");localStorage.setItem("lmsTheme","dark");</script><nav class="mobile-nav"><a href="dashboard.html">⌂<span>Dashboard</span></a><a class="" href="my-program.html">▣<span>My Program</span></a><a class="" href="progress.html">◩<span>Progress</span></a><a class="" href="support.html">◉<span>Support</span></a></nav><script type="module">
import {db,collection,onSnapshot} from "./firebase.js";
const norm=v=>String(v||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const grade=norm(sessionStorage.getItem("studentGrade")||sessionStorage.getItem("studentType")||"");
const matches=v=>{
 const g=norm(v);
 if(!g||g==="all"||g==="allstudents") return true;
 if(g==="grade10") return grade.includes("10");
 if(g==="grade11") return grade.includes("11");
 if(g==="al"||g==="alevel"||g==="advancedlevel") return grade==="al"||grade.includes("advanced");
 return g===grade;
};
document.querySelectorAll("#announcementList > article[data-grade]").forEach(card=>{
 const g=card.dataset.grade;
 card.style.display=matches(g)?"flex":"none";
});
onSnapshot(collection(db,"announcements"),snap=>{
 const host=document.getElementById("firestoreAnnouncementList");
 const now=Date.now();
 const items=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>{
   if(x.enabled===false||x.active===false)return false;
   if(x.expiresAt){
     const ms=typeof x.expiresAt?.toMillis==="function"?x.expiresAt.toMillis():Number(x.expiresAt);
     if(ms&&ms<now)return false;
   }
   const target=x.grade??x.targetGrade??x.targetAudience??"all";
   return Array.isArray(target)?target.some(matches):matches(target);
 }).sort((a,b)=>{
   const t=x=>typeof x?.toMillis==="function"?x.toMillis():Number(x)||0;
   return t(b.createdAt)-t(a.createdAt);
 });
 host.innerHTML=items.length?items.map(x=>{
   const target=x.grade||x.targetGrade||"all";
   const label=String(target).toLowerCase().includes("11")?"Grade 11":String(target).toLowerCase().includes("10")?"Grade 10":(["al","alevel","advancedlevel"].includes(norm(target))?"A/L":"All Students");
   const icon=label==="Grade 11"?"🏆":label==="A/L"?"📄":"📢";
   const safeTitle=String(x.title||"Portal Update").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
   const safeMessage=String(x.message||x.description||"Important information for students.").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
   return `<article class="notice"><i>${icon}</i><div style="flex:1"><div class="notice-top"><h3>${safeTitle}</h3><time>${label}</time></div><p>${safeMessage}</p><span class="tag">ANNOUNCEMENT</span></div></article>`;
  }).join(""):'<div class="empty">No announcements available right now.</div>';
},()=>{});
</script></body></html>
