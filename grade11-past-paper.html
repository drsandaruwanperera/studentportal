<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🎓%3C/text%3E%3C/svg%3E">

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Grade 11 Past Paper</title>

    <link
        rel="stylesheet"
        href="grade11-past-paper.css?v=10"
    >

</head>

<body>

<div class="container">

    <!-- ==========================
         Header
    =========================== -->

    <div class="header">

        <div class="header-content">

            <h1 id="paperTitle">
                📚 Grade 11 Past Paper
            </h1>

            <p id="paperSubtitle">
                Select Part A or Part B
            </p>

        </div>

        <button
            class="back-btn"
            type="button"
            onclick="history.back()"
        >
            ← Back
        </button>

    </div>


    <!-- ==========================
         Part Grid
    =========================== -->

    <div class="part-grid">


        <!-- ==========================
             PART A
        =========================== -->

        <div class="part-card">

            <div class="part-icon">
                📝
            </div>

            <h2>
                Part A
            </h2>

            <p>
                Multiple Choice Questions
            </p>

            <div class="option-grid">

                <button
                    id="partABtn"
                    class="primary-btn"
                    type="button"
                >
                    📄 Part A
                </button>

                <button
                    id="partAAnswerBtn"
                    class="answer-btn"
                    type="button"
                >
                    📝 Part A Answer
                </button>

            </div>

        </div>


        <!-- ==========================
             PART B
        =========================== -->

        <div class="part-card">

            <div class="part-icon">
                📚
            </div>

            <h2>
                Part B
            </h2>

            <p>
                Question Paper
            </p>

            <div class="option-grid">

                <button
                    id="partBBtn"
                    class="primary-btn"
                    type="button"
                >
                    📄 Part B
                </button>

                <button
                    id="partBAnswerBtn"
                    class="answer-btn"
                    type="button"
                >
                    📝 Part B Answer
                </button>

            </div>

        </div>

    </div>

</div>


<script
    src="grade11-past-paper.js?v=10"
></script>

</body>

</html>
