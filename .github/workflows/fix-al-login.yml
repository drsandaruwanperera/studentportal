name: Fix numeric A-L login IDs

on:
  push:
    branches:
      - main

jobs:
  fix:
    if: github.actor == 'drsandaruwanperera'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app.js
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          marker = 'const AL_NUMERIC_STUDENT_IDS = new Set(['
          if marker in text:
              print('Patch already present; nothing to do.')
              raise SystemExit(0)

          ids = [
              '5118','9928','10008','10077','10093','12596','12651','12704','12705','12721','12758',
              '13272','13821','14042','14043','14230','15130','15290','15324','15831','15995','16008',
              '16010','16012','16013','16014','16016','16021','16022','16025','16030','16031','16044',
              '16045','16046','16048','16049','16050','16052','16054','16059','16067','16068','16074',
              '16081','16084','16106','16118','16124','16147','16157','16251','16294','16299','16335',
              '16341','16343','16354','16356','16365','16370','16373','16375','16389','16390','16398',
              '16399','16400','16418','16464','16501','16505','16529','16584','16585','16586','16737',
              '16867','16954','17065','17415','17416'
          ]

          block = '\n'.join([
              '',
              '// =====================================================',
              '// NUMERIC A/L STUDENT IDs',
              '// These IDs belong to the current A/L student group.',
              '// =====================================================',
              'const AL_NUMERIC_STUDENT_IDS = new Set([',
              *[f'    "{sid}",' for sid in ids],
              ']);',
              ''
          ])

          anchor = 'function detectStudentType(\n    studentId,\n    data = {}\n) {'
          if anchor not in text:
              raise SystemExit('Could not find detectStudentType anchor; aborting.')

          text = text.replace(anchor, block + '\n' + anchor, 1)

          old = '''    const cleanId =\n        normalizeStudentId(studentId);\n\n\n    // =================================================\n    // FIREBASE STUDENT TYPE\n    // ================================================='''
          new = '''    const cleanId =\n        normalizeStudentId(studentId);\n\n\n    // =================================================\n    // NUMERIC A/L STUDENT OVERRIDE\n    // =================================================\n\n    if (AL_NUMERIC_STUDENT_IDS.has(cleanId)) {\n\n        return "al";\n\n    }\n\n\n    // =================================================\n    // FIREBASE STUDENT TYPE\n    // ================================================='''
          if old not in text:
              raise SystemExit('Could not find category detection anchor; aborting.')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          print(f'Patched {len(ids)} numeric A/L IDs.')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix numeric A/L student login detection"
          git push
