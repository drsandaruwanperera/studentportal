<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>A/L Paper Viewer • View & Print</title>
    <style>
        * { box-sizing: border-box; }
        html, body { max-width: 100%; overflow-x: hidden; }
        :root {
            --portal-bg: #0b1020;
            --portal-surface: #11182b;
            --portal-surface-2: #151f35;
            --portal-purple: #4037c9;
            --portal-violet: #7c3aed;
            --portal-lime: #a6ff2e;
            --portal-text: #f4f7ff;
            --portal-muted: #aeb8ce;
            --portal-border: rgba(255,255,255,.10);
        }
        body {
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            min-height: 100vh;
            font-family: "Segoe UI", sans-serif;
            color: var(--portal-text);
            background:
                radial-gradient(circle at 8% 10%, rgba(64,55,201,.20), transparent 34%),
                radial-gradient(circle at 92% 88%, rgba(124,58,237,.16), transparent 36%),
                var(--portal-bg);
        }
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 14px 18px;
            background: rgba(11,16,32,.94);
            border-bottom: 1px solid var(--portal-border);
            backdrop-filter: blur(14px);
        }
        .toolbar-title { min-width: 0; }
        .kicker { color: var(--portal-lime); font-size: 11px; font-weight: 800; letter-spacing: 1.3px; }
        h1 { margin: 4px 0 0; font-size: 19px; }
        .actions { display: flex; gap: 9px; flex-wrap: wrap; }
        button, a.action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 10px;
            padding: 10px 15px;
            background: linear-gradient(135deg, var(--portal-purple), var(--portal-violet));
            color: #fff;
            font: inherit;
            font-size: 13px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
        }
        .secondary { background: #202b44 !important; }
        .pages {
            width: min(900px, calc(100% - 28px));
            margin: 22px auto 45px;
            display: grid;
            gap: 18px;
        }
        .page-card {
            min-width: 0;
            padding: 10px;
            border: 1px solid var(--portal-border);
            border-radius: 14px;
            background: var(--portal-surface);
            box-shadow: 0 20px 45px rgba(0,0,0,.25);
        }
        .page-card img {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            background: #fff;
        }
        .page-number {
            padding: 7px 4px 2px;
            color: var(--portal-muted);
            text-align: center;
            font-size: 11px;
        }
        .empty {
            width: min(700px, calc(100% - 28px));
            margin: 60px auto;
            padding: 35px;
            text-align: center;
            border: 1px solid var(--portal-border);
            border-radius: 20px;
            background: var(--portal-surface);
        }
        .empty h2 { margin: 0 0 8px; }
        .empty p { margin: 0; color: var(--portal-muted); }

        @page { size: A4 portrait; margin: 0; }
        @media print {
            html, body {
                display: block !important;
                width: 100%;
                min-height: auto;
                background: #fff !important;
                color: #000 !important;
            }
            .toolbar, .page-number, #empty { display: none !important; }
            .pages {
                width: 100%;
                margin: 0;
                display: block;
            }
            .page-card {
                width: 100%;
                margin: 0;
                padding: 0;
                border: 0;
                border-radius: 0;
                background: #fff;
                box-shadow: none;
                break-after: page;
                page-break-after: always;
            }
            .page-card:last-child {
                break-after: auto;
                page-break-after: auto;
            }
            .page-card img {
                display: block;
                width: 100%;
                max-width: 100%;
                height: auto;
                border-radius: 0;
            }
        }

        /* Mobile layout is screen-only so it cannot override the A4 print layout on iPhone/iPad. */
        @media screen and (max-width: 650px) {
            .toolbar {
                align-items: stretch;
                flex-direction: column;
                gap: 10px;
                padding: 12px;
            }
            h1 { font-size: 17px; }
            .actions { width: 100%; }
            button, a.action { flex: 1; min-height: 42px; }
            .pages {
                width: 100vw;
                max-width: 100vw;
                margin: 12px 0 28px;
                padding: 0;
                gap: 12px;
            }
            .page-card {
                width: 100vw;
                max-width: 100vw;
                padding: 0;
                border: 0;
                border-radius: 0;
                box-shadow: none;
                background: #fff;
            }
            .page-card img {
                display: block;
                width: 100vw;
                max-width: 100vw;
                height: auto;
                border-radius: 0;
            }
            .page-number {
                padding: 6px 2px 2px;
                background: var(--portal-surface);
            }
        }
    </style>
</head>
<body>
    <header class="toolbar">
        <div class="toolbar-title">
            <div class="kicker" id="viewerKicker">A/L TOP RANKING MODEL</div>
            <h1 id="viewerTitle">Paper Viewer</h1>
        </div>
        <div class="actions">
            <button class="secondary" type="button" onclick="history.back()">← Back</button>
            <button id="printPaperBtn" type="button">🖨️ Print Paper</button>
        </div>
    </header>

    <main id="pages" class="pages" aria-live="polite"></main>

    <section id="empty" class="empty" hidden>
        <h2>Paper pages are not available yet</h2>
        <p>Please check again after the page images have been uploaded.</p>
    </section>

    <script type="module" src="al-paper-viewer.js?v=print1"></script>
</body>
</html>
