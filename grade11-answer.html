<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🎓%3C/text%3E%3C/svg%3E">

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Grade 11 Answer</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family:
                Inter,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #eef2f7;
            color: #0f172a;

            overflow: hidden;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        .viewer-header {

            height: 70px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 24px;

            background: #ffffff;

            border-bottom:
                1px solid #e2e8f0;

            box-shadow:
                0 4px 18px
                rgba(15, 23, 42, 0.08);

            position: relative;

            z-index: 100;

        }


        .viewer-title {

            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;

        }


        .viewer-title-icon {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: #f0ebff;

            font-size: 22px;

            flex-shrink: 0;

        }


        #answerTitle {

            font-size: 18px;

            font-weight: 800;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        /* =====================================================
           BACK BUTTON
        ===================================================== */

        .back-button {

            height: 42px;

            padding: 0 18px;

            border: 0;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #6d35f2,
                    #7c3aed
                );

            color: #ffffff;

            font-family: inherit;

            font-size: 13px;

            font-weight: 750;

            cursor: pointer;

        }


        /* =====================================================
           VIEWER
        ===================================================== */

        .viewer {

            width: 100%;

            height:
                calc(100vh - 70px);

            overflow-y: auto;

            overflow-x: hidden;

            padding:
                28px 20px 50px;

            background: #eef2f7;

            user-select: none;

            -webkit-user-select: none;

        }


        #pdfContainer {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 24px;

        }


        .pdf-page {

            position: relative;

            background: #ffffff;

            box-shadow:
                0 8px 30px
                rgba(15, 23, 42, 0.14);

            overflow: hidden;

            user-select: none;

            -webkit-user-select: none;

        }


        .pdf-page canvas {

            display: block;

            max-width: 100%;

            height: auto;

        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            min-height:
                calc(100vh - 150px);

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 15px;

            color: #64748b;

        }


        .loading-spinner {

            width: 52px;
            height: 52px;

            border-radius: 50%;

            border:
                4px solid #e2e8f0;

            border-top-color:
                #6d35f2;

            animation:
                spin .8s linear infinite;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        .loading-text {

            font-size: 14px;

            font-weight: 650;

        }


        /* =====================================================
           ERROR
        ===================================================== */

        .error-screen {

            height:
                calc(100vh - 70px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

        }


        .error-card {

            width:
                min(520px, 100%);

            padding: 40px 30px;

            background: #ffffff;

            border:
                1px solid #e2e8f0;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 14px 40px
                rgba(15, 23, 42, 0.08);

        }


        .error-icon {

            font-size: 48px;

            margin-bottom: 15px;

        }


        .error-card h2 {

            margin:
                0 0 10px;

        }


        .error-card p {

            margin:
                0 0 22px;

            color: #64748b;

            line-height: 1.6;

        }


        .error-back {

            height: 42px;

            padding: 0 20px;

            border: 0;

            border-radius: 10px;

            background: #6d35f2;

            color: #ffffff;

            font-family: inherit;

            font-weight: 700;

            cursor: pointer;

        }


        /* =====================================================
           PRINT BLOCK
        ===================================================== */

        @media print {

            html,
            body {

                display: none !important;

            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .viewer-header {

                height: 62px;

                padding: 0 12px;

            }


            .viewer-title-icon {

                width: 36px;
                height: 36px;

                font-size: 19px;

            }


            #answerTitle {

                font-size: 14px;

            }


            .back-button {

                height: 36px;

                padding: 0 13px;

                font-size: 12px;

            }


            .viewer {

                height:
                    calc(100vh - 62px);

                padding:
                    15px 8px 30px;

            }


            #pdfContainer {

                gap: 14px;

            }

        }

    </style>

</head>


<body>


<header class="viewer-header">

    <div class="viewer-title">

        <div class="viewer-title-icon">
            📖
        </div>

        <div id="answerTitle">
            Grade 11 Answer
        </div>

    </div>


    <button
        type="button"
        class="back-button"
        id="backButton"
    >
        ← Back
    </button>

</header>



<main
    id="viewer"
    class="viewer"
>

    <div
        id="loading"
        class="loading"
    >

        <div class="loading-spinner"></div>

        <div class="loading-text">
            Loading Answer...
        </div>

    </div>


    <div
        id="pdfContainer"
    ></div>

</main>



<script
    type="module"
    src="grade11-answer.js?v=30"
></script>


</body>

</html>
