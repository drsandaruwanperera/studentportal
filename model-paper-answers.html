<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>A/L 2027 MCQ Model Paper — Answers</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--panel:#11182b;--line:#26334b;--text:#f4f7ff;--muted:#aeb8ce;--accent:#5b4bff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    .wrap{max-width:1100px;margin:auto;padding:22px 16px 32px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    h1{font-size:clamp(22px,4vw,32px);margin:8px 0}.sub{color:var(--muted);margin:0 0 20px}
    .tabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tab,.back{border:1px solid var(--line);border-radius:10px;padding:11px 15px;color:var(--text);background:var(--panel);text-decoration:none;cursor:pointer;font-weight:700}
    .tab[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}.viewer{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
    iframe{display:block;width:100%;height:calc(100vh - 245px);min-height:480px;border:0;background:#fff}
    .fallback{padding:10px 14px;background:var(--panel);color:var(--muted);font-size:13px}.fallback a{color:#c9c2ff}
    @media(max-width:600px){.wrap{padding:16px 10px}iframe{height:calc(100vh - 280px);min-height:400px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div><p style="color:#a6ff2e;font-weight:800;letter-spacing:1px;margin:0">A/L STUDENT PORTAL</p><h1>2027 MCQ Model Paper — Answers</h1></div>
      <a class="back" href="model-papers.html">← Back to Model Papers</a>
    </div>
    <p class="sub">Choose a paper to view its answers in your browser.</p>
    <div class="tabs" role="group" aria-label="Choose answer paper">
      <button class="tab" type="button" data-file="1st-Paper.pdf" aria-pressed="true">1st Paper Answers</button>
      <button class="tab" type="button" data-file="2nd-Paper.pdf" aria-pressed="false">2nd Paper Answers</button>
    </div>
    <section class="viewer" aria-label="PDF answer viewer">
      <iframe id="answerViewer" title="Model paper answers PDF" src="answers/1st-Paper.pdf#toolbar=0&navpanes=0"></iframe>
      <div class="fallback">If the PDF does not display in this browser, <a id="openPdf" href="answers/1st-Paper.pdf" target="_blank" rel="noopener">open the answer PDF in a new tab</a>.</div>
    </section>
  </main>
  <script>
    const viewer=document.getElementById('answerViewer');
    const openPdf=document.getElementById('openPdf');
    document.querySelectorAll('[data-file]').forEach(button=>button.addEventListener('click',()=>{
      const file=button.dataset.file;
      const url='answers/'+file;
      viewer.src=url+'#toolbar=0&navpanes=0';
      openPdf.href=url;
      document.querySelectorAll('[data-file]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));
    }));
  </script>
</body>
</html>
