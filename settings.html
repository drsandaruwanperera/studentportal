<!doctype html><html lang="en"><head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🎓%3C/text%3E%3C/svg%3E"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Settings Management</title><link rel="stylesheet" href="website-management.css"></head><body><div class="wrap"><header class="top"><div><p class="eyebrow">MAIN WEBSITE</p><h1>⚙️ Website Settings</h1></div><a class="back" href="website-dashboard.html">← Website Dashboard</a></header><section class="panel"><h2 id="formTitle">Add Website settings</h2><p class="hint">General website display settings. Images are referenced by GitHub repository paths such as <code>assets/gallery/photo.jpg</code>; this page does not upload files to Firebase Storage.</p><form id="form"><div class="grid"><div class="field"><label for="f_siteTitle">Site title</label><input id="f_siteTitle" type="text" ></div><div class="field"><label for="f_heroTitle">Hero title</label><input id="f_heroTitle" type="text" ></div><div class="field"><label for="f_heroSubtitle">Hero subtitle</label><textarea id="f_heroSubtitle" ></textarea></div><div class="field"><label for="f_heroImage">Hero image path</label><input id="f_heroImage" type="text" ></div><div class="field"><label for="f_floatingWhatsapp">Floating WhatsApp number</label><input id="f_floatingWhatsapp" type="text" ></div><div class="field"><label class="check"><input id="f_showGallery" type="checkbox"> Show gallery</label></div><div class="field"><label class="check"><input id="f_showTestimonials" type="checkbox"> Show testimonials</label></div><div class="field"><label class="check"><input id="f_showResources" type="checkbox"> Show resources</label></div></div><div class="actions"><button class="btn primary" type="submit">Save</button><button class="btn secondary" id="resetBtn" type="button">Clear</button></div><div class="msg" id="msg"></div></form></section><section class="panel"><h2>Saved items</h2><div id="list" class="list"><div class="empty">Loading…</div></div></section></div><script type="module" src="website-auth.js"></script><script type="module" src="content-manager.js" data-config='{"collection": "websiteSettings", "slug": "settings", "title": "Website Settings", "fields": [{"key": "siteTitle", "type": "text"}, {"key": "heroTitle", "type": "text"}, {"key": "heroSubtitle", "type": "textarea"}, {"key": "heroImage", "type": "text"}, {"key": "floatingWhatsapp", "type": "text"}, {"key": "showGallery", "type": "checkbox"}, {"key": "showTestimonials", "type": "checkbox"}, {"key": "showResources", "type": "checkbox"}]}'></script></body></html>
