<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🎓%3C/text%3E%3C/svg%3E">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <link rel="stylesheet" href="change-password.css">
</head>
<body>

<div class="container">

    <div class="card">

        <h1>🔒 Change Password</h1>

        <p class="subtitle">
            This is your first login. Please create a new password.
        </p>

        <label>Current Password</label>
        <input
            type="password"
            id="currentPassword"
            placeholder="Current Password">

        <label>New Password</label>
        <input
            type="password"
            id="newPassword"
            placeholder="New Password">

        <label>Confirm New Password</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm New Password">

        <button id="updateBtn">
            Update Password
        </button>

        <p id="msg"></p>

    </div>

</div>

<script type="module" src="change-password.js"></script>

</body>
</html>
