<!doctype html><html lang="en"><head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🎓%3C/text%3E%3C/svg%3E"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact & Social Management</title><link rel="stylesheet" href="website-management.css"></head><body><div class="wrap"><header class="top"><div><p class="eyebrow">MAIN WEBSITE</p><h1>📞 Contact & Social</h1></div><a class="back" href="website-dashboard.html">← Website Dashboard</a></header><section class="panel"><h2 id="formTitle">Add Contact settings</h2><p class="hint">Contact numbers, social links and map link. Images are referenced by GitHub repository paths such as <code>assets/gallery/photo.jpg</code>; this page does not upload files to Firebase Storage.</p><form id="form"><div class="grid"><div class="field"><label for="f_whatsapp">WhatsApp</label><input id="f_whatsapp" type="text" ></div><div class="field"><label for="f_technical">Technical inquiry</label><input id="f_technical" type="text" ></div><div class="field"><label for="f_facebook">Facebook URL</label><input id="f_facebook" type="text" ></div><div class="field"><label for="f_instagram">Instagram URL</label><input id="f_instagram" type="text" ></div><div class="field"><label for="f_tiktok">TikTok URL</label><input id="f_tiktok" type="text" ></div><div class="field"><label for="f_maps">Google Maps URL</label><input id="f_maps" type="text" ></div><div class="field"><label for="f_email">Email</label><input id="f_email" type="text" ></div></div><div class="actions"><button class="btn primary" type="submit">Save</button><button class="btn secondary" id="resetBtn" type="button">Clear</button></div><div class="msg" id="msg"></div></form></section><section class="panel"><h2>Saved items</h2><div id="list" class="list"><div class="empty">Loading…</div></div></section></div><script type="module" src="website-auth.js"></script><script type="module" src="content-manager.js" data-config='{"collection": "websiteContact", "slug": "contact", "title": "Contact & Social", "fields": [{"key": "whatsapp", "type": "text"}, {"key": "technical", "type": "text"}, {"key": "facebook", "type": "text"}, {"key": "instagram", "type": "text"}, {"key": "tiktok", "type": "text"}, {"key": "maps", "type": "text"}, {"key": "email", "type": "text"}]}'></script></body></html>
