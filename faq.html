<!doctype html><html lang="en"><head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🎓%3C/text%3E%3C/svg%3E"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAQ Management</title><link rel="stylesheet" href="website-management.css"></head><body><div class="wrap"><header class="top"><div><p class="eyebrow">MAIN WEBSITE</p><h1>❓ FAQ</h1></div><a class="back" href="website-dashboard.html">← Website Dashboard</a></header><section class="panel"><h2 id="formTitle">Add FAQ items</h2><p class="hint">Frequently asked questions and answers. Images are referenced by GitHub repository paths such as <code>assets/gallery/photo.jpg</code>; this page does not upload files to Firebase Storage.</p><form id="form"><div class="grid"><div class="field"><label for="f_question">Question</label><input id="f_question" type="text" required></div><div class="field"><label for="f_answer">Answer</label><textarea id="f_answer" required></textarea></div><div class="field"><label for="f_order">Order</label><input id="f_order" type="number" ></div><div class="field"><label class="check"><input id="f_enabled" type="checkbox"> Visible</label></div></div><div class="actions"><button class="btn primary" type="submit">Save</button><button class="btn secondary" id="resetBtn" type="button">Clear</button></div><div class="msg" id="msg"></div></form></section><section class="panel"><h2>Saved items</h2><div id="list" class="list"><div class="empty">Loading…</div></div></section></div><script type="module" src="website-auth.js"></script><script type="module" src="content-manager.js" data-config='{"collection": "websiteFAQ", "slug": "faq", "title": "FAQ", "fields": [{"key": "question", "type": "text"}, {"key": "answer", "type": "textarea"}, {"key": "order", "type": "number"}, {"key": "enabled", "type": "checkbox"}]}'></script></body></html>
