<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🎓%3C/text%3E%3C/svg%3E">
<title>Top Ranking Paper Viewer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",Arial,sans-serif;background:#0b1020;color:#f4f7ff;user-select:none;-webkit-user-select:none}body{overflow-x:hidden}.top{min-height:72px;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;gap:12px;background:#11182b;border-bottom:1px solid rgba(255,255,255,.1);position:sticky;top:0;z-index:20}.title{display:flex;align-items:center;gap:12px;min-width:0}.icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(91,75,255,.18);font-size:21px;flex:none}.kicker{color:#a6ff2e;font-size:10px;font-weight:800;letter-spacing:1.1px}.title h1{margin:4px 0 0;font-size:18px}.back{border:0;border-radius:10px;padding:10px 16px;background:linear-gradient(135deg,#5b4bff,#7c3aed);color:#fff;font-weight:800;cursor:pointer;white-space:nowrap}.viewer{width:min(980px,calc(100% - 28px));margin:22px auto 45px}.pages{display:flex;flex-direction:column;align-items:center;gap:18px}.page{width:100%;max-width:900px;background:#fff;box-shadow:0 12px 38px rgba(0,0,0,.35);overflow:hidden}.page canvas{display:block;max-width:100%;height:auto}.loading{margin:55px auto;max-width:560px;padding:28px 22px;text-align:center;color:#aeb8ce;background:#11182b;border:1px solid rgba(255,255,255,.1);border-radius:16px}.loading h2{margin:0 0 9px;color:#f4f7ff;font-size:18px}.loading p{margin:0;font-size:12px;line-height:1.6}.error{color:#fecaca}.error h2{color:#fecaca}
@media(max-width:600px){.top{padding:10px 12px;min-height:62px}.title h1{font-size:14px}.icon{width:36px;height:36px}.back{padding:9px 11px;font-size:11px}.viewer{width:100%;margin:10px auto 25px;padding:0 6px}.pages{gap:9px}.page{border-radius:2px}.loading{margin:25px 10px;padding:22px 16px}}
@media print{html,body{display:none!important}}
</style>
</head>
<body>
<header class="top"><div class="title"><div class="icon">📘</div><div><div class="kicker" id="kicker">A/L TOP RANKING</div><h1 id="title">Paper Viewer</h1></div></div><button class="back" id="back" type="button">← Back</button></header>
<main class="viewer"><div id="loading" class="loading"><h2>Loading PDF…</h2><p>Please wait while the pages are prepared for online viewing.</p></div><div id="pages" class="pages"></div></main>
<script type="module" src="al-top-ranking-answer.js?v=november-viewer-fix1"></script>
</body>
</html>
