<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🎓%3C/text%3E%3C/svg%3E">

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Province Papers - 1st Paper</title>

    <link
        rel="stylesheet"
        href="province-paper1.css"
    >

    <style>

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header h1 {
            margin-right: auto;
        }

        .paper-switch {
            display: flex;
            gap: 8px;
        }

        .paper-switch button {
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            background: #e9e7ff;
            color: #5b35d5;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .paper-switch button:hover {
            transform: translateY(-1px);
        }

        .paper-switch button.active {
            background: #6938ef;
            color: #ffffff;
        }

        .back-btn {
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            background: #6938ef;
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .back-btn:hover {
            background: #5728d8;
        }

        @media (max-width: 700px) {

            .header {
                display: grid;
                grid-template-columns: 1fr;
            }

            .header h1 {
                margin-right: 0;
            }

            .paper-switch {
                width: 100%;
            }

            .paper-switch button {
                flex: 1;
            }

            .back-btn {
                width: fit-content;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================================
         HEADER
    ========================================== -->

    <div class="header">


        <h1>
            📂 Province Wise 1st Paper
        </h1>


        <!-- =====================================
             PAPER SWITCH
        ====================================== -->

        <div class="paper-switch">


            <button
                type="button"
                class="active"
                onclick="window.location.href='province-paper1.html'"
            >
                1st Paper
            </button>


            <button
                type="button"
                onclick="window.location.href='province-paper2.html'"
            >
                2nd Paper
            </button>


        </div>


        <!-- =====================================
             BACK
        ====================================== -->

        <button
            type="button"
            class="back-btn"
            onclick="history.back()"
        >
            ← Back
        </button>


    </div>


    <!-- =========================================
         PROVINCES
    ========================================== -->

    <div id="paperContainer">

    </div>


</div>


<!-- =========================================
     JAVASCRIPT
========================================== -->

<script
    type="module"
    src="province-paper1.js"
></script>


</body>

</html>
